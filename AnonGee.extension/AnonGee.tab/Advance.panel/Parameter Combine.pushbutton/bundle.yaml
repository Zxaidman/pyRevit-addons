title: Parameter Combination
author: AnonGee
context: selection
tooltip: |
  Write a value into a target parameter across the selected elements, built
  from one of four operations with a live, per-element preview before you apply.

  Operations
    • Formula — combine source parameters (and optional math) into the target.
    • Find & Replace — substitute text in the existing value.
    • Prefix / Suffix — wrap the existing value.
    • Sequence — number elements from a start value and step.

  Notes
    • Select elements before running; an output text case can be forced.
    • Tick the rows to change in the preview; all edits run in one transaction.
