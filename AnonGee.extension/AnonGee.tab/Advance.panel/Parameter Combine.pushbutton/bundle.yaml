title: Parameter Combination
author: AnonGee
tooltip: |
  Write a value into a target parameter across model elements, built from one
  of four operations with a live, per-element preview before you apply.

  Operations
    • Formula — combine source parameters (and optional math) into the target.
    • Find & Replace — substitute text in the existing value.
    • Prefix / Suffix — wrap the existing value.
    • Sequence — number elements from a start value and step.

  Notes
    • No selection needed — on launch, pick a scope (Active View or Whole Model)
      and the categories to load.
    • Tick the rows to change in the preview; an output text case can be forced.
    • All edits run in a single transaction.
